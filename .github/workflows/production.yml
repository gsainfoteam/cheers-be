name: Build and push image (prod)

on:
  push:
    tags:
      - "prod-v*"

env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) from the Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          tags: ${{ env.IMAGE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 어드민 화면 번들에 들어가는 값. 비어 있으면 로그인이 안 되는 이미지가 나오므로 빌드를 멈춤
      - name: Validate admin build args
        env:
          VITE_IDP_AUTHORIZE_URL: ${{ vars.PROD_IDP_AUTHORIZE_URL }}
          VITE_IDP_CLIENT_ID: ${{ vars.PROD_IDP_CLIENT_ID }}
        run: |
          if [[ -z "$VITE_IDP_AUTHORIZE_URL" || -z "$VITE_IDP_CLIENT_ID" ]]; then
            echo "::error::PROD_IDP_AUTHORIZE_URL / PROD_IDP_CLIENT_ID 값이 비어 있습니다. GitHub repository variables 를 확인하세요."
            exit 1
          fi

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_IDP_AUTHORIZE_URL=${{ vars.PROD_IDP_AUTHORIZE_URL }}
            VITE_IDP_CLIENT_ID=${{ vars.PROD_IDP_CLIENT_ID }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Update Git Repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          repository: gsainfoteam/icarus-gitops
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|tag:.*|tag: ${{ needs.build.outputs.image_tag }}|g" infoteam/service-v2/cheers/prod/values.yaml

      - name: Commit and Push
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git commit -am "Update image $REPOSITORY:$IMAGE_TAG"
          git push -u origin main
