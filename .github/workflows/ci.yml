name: CI

on:
  pull_request:
    branches:
      - develop
      - release
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  # AppModule 을 테스트 안에서 띄워 일회용 Postgres 로 API 흐름을 검증.
  # Google · 메일 · Slack · S3 는 가짜로 대체하므로 저장소 시크릿을 쓰지 않음
  e2e:
    name: e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cheers
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cheers_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheers -d cheers_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cheers:password@localhost:5432/cheers_e2e
      E2E_DATABASE_URL: postgresql://cheers:password@localhost:5432/cheers_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up
        uses: ./.github/actions/setup

      - name: Apply migrations
        run: bun run db:migrate

      - name: E2E test
        run: bun run test:e2e

  # runner 안에서만 뜨는 일회용 Postgres 에 마이그레이션을 적용해 보고,
  # 스키마 변경에 맞는 마이그레이션이 커밋돼 있는지 확인
  migration:
    name: migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cheers
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cheers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cheers -d cheers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cheers:password@localhost:5432/cheers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up
        uses: ./.github/actions/setup

      - name: Apply migrations
        run: bun run db:migrate

      # 이미 적용된 마이그레이션을 다시 돌려도 no-op 이어야 함
      - name: Re-apply migrations
        run: bun run db:migrate

      - name: Check migration drift
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle/schema 변경에 맞는 마이그레이션이 없습니다. bun run db:generate 후 생성된 파일을 커밋하세요"
            git status --porcelain drizzle
            git diff drizzle
            exit 1
          fi
