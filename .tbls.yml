# docs/schema/ 생성 설정. 생성 · 검사 방법은 README 의 "DB 스키마 문서" 참고
# DB 이름을 고정하지 않으면 문서 제목이 접속한 DB 이름을 따라가서 환경마다 diff 가 생김
name: cheers
docPath: docs/schema
disableOutputSchema: true
er:
  format: mermaid
  hideDef: true
# 컬럼명 pk 가 Mermaid 의 PK 예약어와 겹쳐 파싱에 실패하므로 *pk 로 출력 (tbls 기본 템플릿에서 이 부분만 수정)
templates:
  mermaid:
    schema: scripts/tbls-templates/schema.mermaid.tmpl
    table: scripts/tbls-templates/table.mermaid.tmpl
exclude:
  - __drizzle_migrations

desc: |
  [tbls](https://github.com/k1LoW/tbls)로 생성한 문서입니다. 직접 고치지 말고 `.tbls.yml`이나 `drizzle/schema/`를 고친 뒤 `bun run db:docs`로 다시 생성하세요.

  FK는 모두 `ON DELETE NO ACTION`입니다. 부모 행을 지우기 전에 백엔드가 같은 트랜잭션에서 자식 행을 먼저 지웁니다.

  서비스 로직으로 지키는 규칙:

  - `users.type`과 `student` / `graduated` 행이 일치함. 유형은 가입 중에만 바꿀 수 있음
  - `pending` 유저는 가입 절차 API만 호출할 수 있음
  - 가입 후 · 마지막 활동 후 24시간이 지난 `pending` 유저는 스케줄러가 삭제함
  - 필수 약관은 철회할 수 없음
  - 재학생 학과는 인증한 학교 이메일 도메인의 학교 소속이어야 함
  - 학교에는 허용 이메일 도메인이 1개 이상 있어야 하고, 인증을 마친 재학생이 있는 도메인은 뺄 수 없음
  - 재학생의 `coffee_chat_contact`는 두 플래그 중 하나 이상이 true여야 함 (현업자는 둘 다 false 가능)
  - `student_profile`과 첨부는 프로필 수정 때 insert만 함. 지우는 경우는 가입 중 유형 변경과 탈퇴 처리뿐임
  - `graduated.verified_at`이 null인 현업자는 `active`여도 재학생에게 보이지 않고 커피챗 요청을 받거나 처리할 수 없음 (어드민의 명함 인증 취소)

comments:
  - table: admin_account
    tableComment: 어드민 페이지에 로그인할 수 있는 이메일 목록. 앱 유저(users)와 관계없음
    columnComments:
      email: 소문자로 저장. IdP가 확인해 준 이메일과 비교
      role: superadmin만 어드민 계정을 등록 · 변경 · 삭제할 수 있음
  - table: admin_access_log
    tableComment: 어드민의 개인정보 열람 기록. insert만 함. 탈퇴 삭제(purge)를 막지 않도록 다른 테이블로 FK를 걸지 않음
    columnComments:
      admin_email: 열람 시점의 어드민 이메일. 어드민 계정을 지워도 남음
      target_type: 열람한 개인정보 종류
      target_id: "target_type = business_card: graduated.pk"
  - table: admin_audit_log
    tableComment: 어드민의 데이터 변경 기록 (변경 전 · 후 값). 변경과 같은 트랜잭션에서 insert만 함. 대상이 지워져도 남도록 다른 테이블로 FK를 걸지 않음
    columnComments:
      admin_email: 요청 시점의 어드민 이메일. 어드민 계정을 지워도 남음
      action: '"<target_type>.<verb>" (예: admin_account.role_update). 목록은 drizzle/schema/admin-audit-log.ts의 ADMIN_AUDIT_ACTIONS'
      target_type: 변경된 엔티티 종류 (admin_account, interest, company 등)
      target_id: 대상 엔티티 pk (문자열). 일괄 작업은 null
      before: 변경 전 값 (JSON). 생성이면 null
      after: 변경 후 값 (JSON). 삭제면 null
  - table: users
    tableComment: 모든 유저의 공통 정보. 유형별 정보는 student / graduated
    columnComments:
      is_deleted: 탈퇴 유예기간이 끝나 개인정보를 지운 유저면 true
      status: 가입 진행 중이면 pending, 추가 정보 입력까지 마치면 active
      type: OAuth 로그인 요청에서 받음
      last_active_at: 로그인 · 토큰 갱신 · 내 정보 조회 때 갱신
      name: 추가 정보 입력에서 한 번 받음 (OAuth 이름은 쓰지 않음). 이후 수정 불가
      withdraw_requested_at: 탈퇴 요청 시각. 유예기간(active는 WITHDRAWAL_GRACE_DAYS, pending은 1일) 안에 다시 로그인하면 null로 되돌림
  - table: user_oauth_account
    tableComment: 유저에 연동된 OAuth 계정
    columnComments:
      email: Apple은 이메일을 숨기거나 최초 로그인 이후 제공하지 않을 수 있음
  - table: refresh_token
    tableComment: 리프레시 토큰
    columnComments:
      opaque_hash: 토큰 해시. 원문은 저장하지 않음
  - table: jwt_signing_key
    tableComment: 서버 전체에서 하나인 JWT 서명 키. replica가 각자 다른 키를 넣지 못하도록 행을 1개로 제한
    columnComments:
      private_key: 평문이라 DB가 유출되면 access token을 위조할 수 있음
  - table: consent
    tableComment: 약관 버전 기준 데이터. 새 버전은 행을 수정하지 말고 어드민에서 새로 등록 (POST /api/manager/v1/consent)
    columnComments:
      is_required: 필수 약관 여부. 필수 약관은 철회할 수 없음
  - table: user_consent
    tableComment: 동의 이력. 철회하면 revoked_at 기록, 재동의는 새 행
    columnComments:
      revoked_at: null이면 유효한 동의. 유효한 동의는 약관 버전당 1개
  - table: coffee_chat_contact
    tableComment: 커피챗 연락수단 (재학생 · 현업자 공통). 희망하지 않음 = 두 플래그 모두 false
    columnComments:
      phone: 하이픈 없이 정규화해서 저장. 카카오 알림톡을 끄면 null로 지움
      email: 이메일 연락을 끄면 null로 지움
  - table: student
    tableComment: 재학생
    columnComments:
      email: 인증을 마친 학교 이메일
  - table: student_email_verification
    tableComment: 진행 중인 학교 이메일 인증. 학생당 1개, 재요청 시 upsert, 인증 성공 시 행 삭제
    columnComments:
      code: 인증번호의 HMAC-SHA256 (hex). 원문은 저장하지 않음
  - table: student_email_send_log
    tableComment: 학교 이메일 인증번호 전송 기록 (전송마다 새 행). 최근 24시간 전송 상한 · 누적 실패 상한에 씀. 유형을 바꾸면 student 행이 새로 만들어져 횟수가 초기화되므로 user_pk 기준
    columnComments:
      failed_attempt_count: 이 전송의 코드로 틀린 횟수. 재전송해도 이전 기록에 남음
  - table: student_profile
    tableComment: 재학생 추가 정보 버전. 수정하면 새 버전, 현재 값 = 가장 큰 version
    columnComments:
      interests: interest.name 값을 문자열로 저장
      activities: 참여 활동 (마이페이지 선택 입력)
  - table: student_profile_attachment
    tableComment: CV · 포트폴리오. 이전 버전이 참조하므로 프로필 수정 때는 S3 파일을 지우지 않음. 행과 파일은 탈퇴 만료 처리 때 지움
    columnComments:
      url: "source = file: S3 object key (비공개 버킷, presigned URL로 접근), link: 외부 URL"
      file_name: source = file일 때 원본 파일명
  - table: school
    tableComment: 학교 기준 데이터 (seed로 pk를 고정해서 넣음)
    columnComments:
      email_domain: 쓰지 않음 (school_email_domain으로 옮김). 배포 중 이전 버전 pod가 읽으므로 남겨 두고 다음 릴리스에서 지움
  - table: school_email_domain
    tableComment: 학교 이메일 인증 시 허용 도메인. 재학생의 학교를 정하는 기준이라 한 도메인은 한 학교에만 속함. 변경은 superadmin만 할 수 있음
    columnComments:
      domain: 소문자로 저장
  - table: department
    tableComment: 학과 기준 데이터. 어드민에서 추가 · 수정. 학과명이 바뀌면 같은 행의 name만 수정 (버전 관리 안 함). 학생 프로필이 참조하므로 지우지 않고 비활성화함
    columnComments:
      is_active: false면 앱의 학과 목록에서 숨기고 새로 고를 수 없음. 이미 고른 학생의 프로필과 조회는 그대로
  - table: interest
    tableComment: 재학생이 고를 수 있는 고정 관심 분야 기준 데이터. 목록 수정은 어드민에서 하며(이미 저장된 student_profile.interests는 바꾸지 않음), 서버는 기동 때 읽어 메모리에 두고 쓰기 직후 · 1분마다 다시 읽음
  - table: graduated
    tableComment: 현업자
    columnComments:
      verified_at: 명함 등록 시각. 어드민이 인증을 취소하면 null (재업로드하면 다시 채움)
      business_card_key: 명함 사진 S3 object key (비공개 버킷, presigned URL로 접근)
  - table: graduated_profile
    tableComment: 현업자 추가 정보. 알림 수단 · 공유할 연락처는 coffee_chat_contact
    columnComments:
      nickname: 가입 후 수정 불가
      company_alias_pk: 회사. 화면에는 company_alias.name 을 씀
      department: 회사 부서 (비공개)
      job: 직무
      hashtags: 마이페이지에서 선택 입력
      links: 마이페이지에서 선택 입력
  - table: company_alias
    tableComment: 회사 (공식 이름). 현업자 목록 등 화면에는 이 이름과 로고가 나가며, 사람마다 다른 표기는 company_name에 묶임
    columnComments:
      logo_key: 회사 로고 S3 object key (비공개 버킷, presigned URL로 접근)
      needs_review: 현업자가 등록되지 않은 이름을 입력해 생긴 회사. 어드민이 승인하거나 다른 회사에 병합
  - table: company_name
    tableComment: 회사 이름 표기. 회사 검색은 이 테이블만 봄 (회사 이름도 여기에 들어 있음). 한 표기는 한 회사에만 속함
    columnComments:
      name: 입력된 원문
      normalized_name: 앞뒤 공백 제거 · 연속 공백 하나로 · 소문자 (normalizeCompanyName). 검색 · 중복 판단용
  - table: coffee_chat_request
    tableComment: 커피챗 요청. 같은 현업자에게 중복 요청 가능. 진행 단계(현업자 확인 → 연락처 공유 → 재학생 확인)는 처음 했을 때 시각만 기록
    columnComments:
      student_profile_pk: 요청 당시의 재학생 정보 버전. 다른 학생의 버전이 들어가지 않도록 student_pk와 복합 FK
      shared_phone: 공유 시점 현업자 연락처
      shared_email: 공유 시점 현업자 연락처
  - table: notification_log
    tableComment: 이메일 · 카카오 알림톡 전송 로그 (channel로 구분). 시도마다 새 행. 실패한 행에 next_retry_at이 있으면 재시도 스케줄러가 처리하고 비움 (CRB-75). 접수된 알림톡은 결과 동기화 스케줄러가 알리고에서 카카오 최종 결과를 가져와 delivery_*에 남김 (CRB-77)
    columnComments:
      recipient: 이메일 주소 또는 전화번호
      provider_message_id: 발송사 메시지 ID (알림톡은 알리고 mid)
      attempt: 몇 번째 발송 시도인지 (1 = 처음 발송, 최대 4)
      next_retry_at: 이 실패를 다시 보낼 시각. null이면 재시도 대상이 아님 (성공 · 마지막 시도 · 이미 재시도함)
      delivery_status: 알림톡 최종 결과 (pending 대기 · delivered 도달 · failed 카카오 단계 실패 · unknown 24시간 내 결과 없음). null이면 조회 대상이 아님 (이메일 · 접수 실패)
      delivery_code: 알리고 전송결과의 rslt (카카오 결과 코드)
      delivery_message: 알리고 전송결과의 rslt_message (실패 사유)
      delivery_reported_at: 알리고가 카카오 결과를 받은 시각 (rsltdate)
      delivery_next_check_at: 다음에 결과를 조회할 시각. null이면 조회하지 않음 (결과 확정 · 대상 아님)
